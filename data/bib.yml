  author: "Mialon et al."
  year: 2023
  section: "3. Evaluation and Benchmarks"
  summary: >
    GAIA is a benchmark designed to evaluate the capabilities of general-purpose AI assistants across realistic, goal-oriented tasks. It includes 466 human-posed questions that require multimodal reasoning, web navigation, tool use, and access to real-world information. Unlike abstract logic puzzles, GAIA focuses on conceptually simple but practically grounded tasks, revealing large performance gaps between humans and state-of-the-art models like GPT-4. The benchmark highlights the limitations of current LLM-based agents in autonomy, planning, and external integration.
