- id: "wang-2022"
  type: "paper"
  title: "Self-Consistency Improves Chain of Thought Reasoning in Large Language Models"
  author: "Wang et al."
  year: 2022
  section: "2. Architectures and System Design"
  subsection: "2.1 Reasoning and Action Patterns"
  summary: >
    Building on Chain-of-Thought prompting, this paper proposes Self-Consistency: a decoding strategy that samples multiple reasoning paths and selects the most consistent final answer. Rather than relying on a single greedy output, the model explores diverse chains of reasoning and chooses the dominant conclusion. This approach boosts accuracy across several reasoning benchmarks and anticipates agentic behaviors like self-reflection, verification, and ensemble thought.
