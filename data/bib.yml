- id: "wei-2022"
  type: "paper"
  title: "Chain-of-Thought Prompting Elicits Reasoning in Large Language Models"
  author: "Wei et al."
  year: 2022
  section: "2. Architectures and System Design"
  subsection: "2.1 Reasoning and Action Patterns"
  summary: >
    This foundational paper introduces Chain-of-Thought (CoT) prompting: a simple technique where models are guided to reason through problems step-by-step by including intermediate reasoning steps in the prompt. CoT significantly improves performance on arithmetic, commonsense, and symbolic reasoning tasks—especially in larger models like PaLM. The paper laid the groundwork for later developments like ReAct and Reflexion, and reframed prompting as a tool for inducing emergent reasoning.
