- id: "sapkota-2025"
  type: "paper"
  title: "AI Agents vs. Agentic AI: A Conceptual Taxonomy, Applications and Challenges"
  author: "Ranjan Sapkota et al."
  year: 2025
  section: "1. Foundational Concepts"
  summary: >
    This study critically distinguishes between AI Agents and Agentic AI, offering a structured conceptual taxonomy, application mapping, and challenge analysis to clarify their divergent design philosophies and capabilities. AI Agents are characterized as modular systems driven by Large Language Models (LLMs) and Large Image Models (LIMs) for narrow, task-specific automation. In contrast, Agentic AI systems represent a paradigmatic shift marked by multi-agent collaboration, dynamic task decomposition, persistent memory, and orchestrated autonomy. The paper presents a comparative analysis across both paradigms, examining application domains such as customer support and research automation, and discusses unique challenges including hallucination and coordination failure.
  arxiv: "2505.10468"
