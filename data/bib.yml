- id: "minsky-1961"
  type: "paper"
  title: "Steps Toward Artificial Intelligence"
  author: "Marvin Minsky"
  year: 1961
  section: "1. Foundational Concepts"
  summary: >
    This seminal paper lays out a roadmap for modeling intelligent behavior computationally. Minsky surveys early methods for learning, planning, memory, and self-modifying programs, proposing building blocks for general intelligence. Many of these concepts—such as task decomposition, partial solutions, and cognitive architecture—still resonate in modern agent systems. A foundational text for thinking about how machines might reason, act, and adapt.

- id: "engelbart-1962"
  type: "paper"
  title: "Augmenting Human Intellect"
  author: "Douglas Engelbart"
  year: 1962
  section: "1. Foundational Concepts"
  summary: >
    A foundational report proposing the use of computers to amplify human intelligence. Engelbart lays out principles that would later lead to the invention of the mouse, hypertext, and interactive computing. Essential reading to understand the original ethos behind building systems that empower human agency.
