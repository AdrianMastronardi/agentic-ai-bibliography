- id: "wang-2023"
  type: "paper"
  title: "Voyager: An Open-Ended Embodied Agent with Large Language Models"
  author: "Wang et al."
  year: 2023
  section: "3. Evaluation and Benchmarks"
  cross_references:
    - section: "7. Case Studies and Applications"
      subsection: "7.5 Lifelong Autonomy and Open-Ended Environments"
      context: "Voyager demonstrates an autonomous LLM-based agent operating in Minecraft. Its ability to learn skills over time and adapt to unstructured environments makes it one of the most complete agentic applications to date."
  summary: >
    Voyager is the first LLM-powered embodied lifelong learning agent in Minecraft that continuously explores the world, acquires diverse skills, and makes novel discoveries without human intervention. It comprises three key components: (1) an automatic curriculum that maximizes exploration, (2) an ever-growing skill library of executable code for storing and retrieving complex behaviors, and (3) a new iterative prompting mechanism that incorporates environment feedback, execution errors, and self-verification for program improvement. Voyager interacts with GPT-4 via blackbox queries, bypassing the need for model parameter fine-tuning. Empirically, Voyager demonstrates strong in-context lifelong learning capabilities, outperforming prior state-of-the-art methods by obtaining 3.3× more unique items, traveling 2.3× longer distances, and unlocking key tech tree milestones up to 15.3× faster.
  arxiv: "2305.16291"
