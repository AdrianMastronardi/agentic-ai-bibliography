name: Build and Deploy Bibliography

on:
  push:
    branches: [ main ]
    paths:
      - 'bibliography/**'
      - 'scripts/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'data/bib.yml'
      - 'data/toc.yml'
      - 'scripts/**'
      - 'bibliography/**'
  workflow_dispatch:  # Allow manual triggers

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        
    - name: Install markdownlint
      run: |
        npm install -g markdownlint-cli
        
    - name: Verify dependencies
      run: |
        python --version
        
    - name: Run consistency checks
      run: python scripts/check_consistency_simple.py
      
    - name: Export to markdown
      run: python scripts/export_to_bibliography.py
      
    - name: Validate generated markdown with markdownlint
      run: |
        echo "Validating generated markdown files..."
        markdownlint bibliography/*.md --config .markdownlint.json
        echo "✅ All generated markdown files pass markdownlint validation"
        
    - name: Validate scripts documentation
      run: |
        echo "Validating scripts documentation..."
        markdownlint scripts/README.md --config .markdownlint.json
        echo "✅ Scripts documentation passes markdownlint validation"
        
    - name: Verify bibliography files exist and are valid
      run: |
        echo "Verifying bibliography files..."
        if [ ! -d "bibliography" ] || [ -z "$(ls -A bibliography/*.md 2>/dev/null)" ]; then
          echo "❌ Bibliography files not found, regenerating..."
          python scripts/export_to_bibliography.py
        fi
        echo "✅ Bibliography files verified"
        
    - name: List generated files
      run: |
        echo "Generated bibliography files:"
        find bibliography -name "*.md" | head -10
        
    - name: Upload bibliography artifacts
      uses: actions/upload-artifact@v4
      with:
        name: bibliography-markdown
        path: bibliography/
        retention-days: 30
      
    - name: Upload to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      uses: actions/upload-pages-artifact@v3
      with:
        path: ./bibliography
        
    - name: Deploy to GitHub Pages
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      id: deployment
      uses: actions/deploy-pages@v4
        
  validate-data:
    runs-on: ubuntu-latest
    needs: build
    if: always()
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyyaml
        
    - name: Validate YAML structure
      run: |
        python -c "
        import yaml
        import sys
        
        # Validate bib.yml
        try:
            with open('data/bib.yml', 'r', encoding='utf-8') as f:
                bib_data = yaml.safe_load(f)
            print(f'✅ bib.yml is valid YAML with {len(bib_data)} entries')
        except Exception as e:
            print(f'❌ bib.yml validation failed: {e}')
            sys.exit(1)
            
        # Validate toc.yml
        try:
            with open('data/toc.yml', 'r', encoding='utf-8') as f:
                toc_data = yaml.safe_load(f)
            sections = len(toc_data.get('toc', []))
            print(f'✅ toc.yml is valid YAML with {sections} sections')
        except Exception as e:
            print(f'❌ toc.yml validation failed: {e}')
            sys.exit(1)
        "
        
    - name: Check for required fields
      run: |
        python -c "
        import yaml
        import sys
        
        with open('data/bib.yml', 'r', encoding='utf-8') as f:
            entries = yaml.safe_load(f)
            
        required_fields = ['id', 'title', 'author', 'year', 'section', 'summary']
        missing_fields = []
        
        for i, entry in enumerate(entries):
            for field in required_fields:
                if field not in entry or not entry[field]:
                    missing_fields.append(f'Entry {i+1} ({entry.get(\"id\", \"unknown\")}): missing {field}')
        
        if missing_fields:
            print('❌ Missing required fields:')
            for msg in missing_fields[:10]:  # Show first 10
                print(f'  {msg}')
            if len(missing_fields) > 10:
                print(f'  ... and {len(missing_fields) - 10} more')
            sys.exit(1)
        else:
            print(f'✅ All {len(entries)} entries have required fields')
        "
        
    - name: Check for duplicate IDs
      run: |
        python -c "
        import yaml
        import sys
        from collections import Counter
        
        with open('data/bib.yml', 'r', encoding='utf-8') as f:
            entries = yaml.safe_load(f)
            
        ids = [entry.get('id', '') for entry in entries]
        duplicates = [id for id, count in Counter(ids).items() if count > 1]
        
        if duplicates:
            print(f'❌ Duplicate IDs found: {duplicates}')
            sys.exit(1)
        else:
            print(f'✅ All {len(ids)} entries have unique IDs')
        "
